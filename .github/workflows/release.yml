name: Build and Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: BUILD AND SIGN APK
  # ==========================================
  build:
    name: Build Signed APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    environment:
      name: android-release

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37
        run: |
          android sdk list --beta --all
          android sdk install --beta platforms/android-37 build-tools/37.0.0

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Restore and validate keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_BASE64:?Missing keystore}"
          : "${KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${KEY_ALIAS:?Missing key alias}"
          : "${KEY_PASSWORD:?Missing key password}"

          mkdir -p android/app
          umask 077

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/release-key.jks

          test -s android/app/release-key.jks

          keytool -list \
            -keystore android/app/release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Remove signing key
        if: always()
        run: |
          rm -f android/app/release-key.jks

      - name: Rename APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"
          mv "$APK" "yadli_v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: yadli_v*.apk
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # JOB 2: PUBLISH GITHUB RELEASE
  # ==========================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs: build

    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.apk
          token: ${{ github.token }}
